# AdBlocklist 规则源配置文件
# 所有规则源均为原始上游规则源，不引用第三方二次整合产物
# 支持 block（阻断源）与 allow（白名单源）
# 规模层级 (tier): lite（精简版）/ standard（标准版）/ full（完整版）
# 覆盖区域 (region): china（国内版）/ overseas（海外版）/ all（全域版）
# 规则格式 (format): adblock / hosts / domains

settings:
  outputDir: "output"
  timeoutMs: 30000
  retries: 3
  userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
  excludeSources:
    - name: "本地基础设施误判排除清单"
      path: "config/exclude.txt"
  allowlistSources:
    - name: "本地应用核心放行规则"
      path: "config/allowlist.txt"
    - name: "GOODBYEADS 精选白名单"
      url: "https://raw.githubusercontent.com/8680/GOODBYEADS/master/data/mod/whitelist.txt"
  readmeTemplate: "templates/README.md.tpl"
  targetReadme: "README.md"
  enableSubdomainPruning: true
  maxOutputSizeBytes: 20971520

