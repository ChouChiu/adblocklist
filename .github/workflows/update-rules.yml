name: Update Rules

on:
  schedule:
    # 每天 04:00 和 16:00 UTC 自动执行 (北京时间 12:00 和 00:00)
    - cron: '0 4,16 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config/**'
      - 'src/**'
      - 'templates/**'
      - 'package.json'
      - 'bun.lock'

concurrency:
  group: update-rules
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run code lint & tests
        run: |
          bun run lint
          bun run test

      - name: Build rule matrices
        run: bun run start

      - name: Commit and push updated rules
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/ README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(rules): update subscriptions $(date -u +'%Y-%m-%d %H:%M:%S UTC') [skip ci]"
            git push
          else
            echo "No changes in subscription rules."
          fi
